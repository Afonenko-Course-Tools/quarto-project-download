name: Проверка материалов Quarto
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        quarto: ["1.11.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Проверить точный commit исходников
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: ${{ matrix.quarto }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course
          ref: 0613a4c6409d6cf766f926b8e096fd35d2a88422 # Core 8.4.0: точный отдельно проверенный кандидат
          path: core-fixture
          persist-credentials: false
      - name: Проверить закреплённый Core
        run: |
          git -C core-fixture rev-parse HEAD
          test "$(git -C core-fixture rev-parse HEAD)" = "0613a4c6409d6cf766f926b8e096fd35d2a88422"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-reference-catalog
          ref: 23312f3bd747a8f665fd2313afbb1c95c42978ac # QRC 3.2.0: preserving merge с main
          path: qrc-fixture
          persist-credentials: false
      - name: Проверить закреплённый QRC
        run: test "$(git -C qrc-fixture rev-parse HEAD)" = "23312f3bd747a8f665fd2313afbb1c95c42978ac"
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c
        with:
          version: v0.17.1
      - name: Полный контракт Download и native installed model artifacts
        env:
          CORE: ${{ github.workspace }}/core-fixture
          QRC: ${{ github.workspace }}/qrc-fixture
        run: bash tools/check.sh
