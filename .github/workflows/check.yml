name: Проверка материалов Quarto
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        quarto: ["1.11.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Проверить точный commit исходников
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: ${{ matrix.quarto }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course
          ref: 5f4590aa4eb524830715f8020c8ff3c504197f73 # Core: Source принят; hosted CI и выпуск отдельно
          path: core-fixture
          persist-credentials: false
      - name: Проверить закреплённый Core
        run: |
          git -C core-fixture rev-parse HEAD
          test "$(git -C core-fixture rev-parse HEAD)" = "5f4590aa4eb524830715f8020c8ff3c504197f73"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-reference-catalog
          ref: 798f8c0d9f87fd5dcfe9ee85b79df57e647d2f3c # QRC 3.2.0: inferred TS contracts, preserving accepted history
          path: qrc-fixture
          persist-credentials: false
      - name: Проверить закреплённый QRC
        run: test "$(git -C qrc-fixture rev-parse HEAD)" = "798f8c0d9f87fd5dcfe9ee85b79df57e647d2f3c"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course-prairielearn
          ref: 4d39a6648d2816bab9a372877deded3320ff35e1 # PL: согласованный ordinary fixture; публикация и paired CI отдельно
          path: pl-fixture
          persist-credentials: false
      - name: Проверить закреплённый PrairieLearn
        run: test "$(git -C pl-fixture rev-parse HEAD)" = "4d39a6648d2816bab9a372877deded3320ff35e1"
      - name: Полный контракт Download и native installed model artifacts
        env:
          CORE: ${{ github.workspace }}/core-fixture
          QRC: ${{ github.workspace }}/qrc-fixture
          PL: ${{ github.workspace }}/pl-fixture
        run: bash tools/check.sh
