name: Проверка материалов Quarto
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PERFORMANCE: ${{ github.workspace }}/tests/dependencies/quarto-course-performance
      COURSE_PERFORMANCE_SOURCE: ${{ github.workspace }}/tests/dependencies/quarto-course-performance
    strategy:
      fail-fast: false
      matrix:
        quarto: ["1.11.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Подготовить прямые исходники интеграционных проверок
        run: |
          git submodule update --init
          # ShellCheck: $sm_path раскрывается самим git submodule foreach.
          # shellcheck disable=SC2016
          git submodule foreach 'printf "%s " "$sm_path"; git rev-parse HEAD'
      - name: Подготовить доступный кеш Quarto
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/course-download-cache
          LUA_LANGUAGE_SERVER: ${{ runner.temp }}/course-download-luals/bin/lua-language-server
        run: |
          mkdir -p -- "$XDG_CACHE_HOME"
          test -w "$XDG_CACHE_HOME"
          printf 'XDG_CACHE_HOME=%s\n' "$XDG_CACHE_HOME" >> "$GITHUB_ENV"
          printf 'LUA_LANGUAGE_SERVER=%s\n' "$LUA_LANGUAGE_SERVER" >> "$GITHUB_ENV"
      - name: Проверить точный commit исходников
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.14
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: ${{ matrix.quarto }}
      - name: Установить LuaLS из исходников Performance
        run: |
          bash "$PERFORMANCE/tools/setup-mv-ci.sh" "$RUNNER_TEMP/course-gnu-mv" >> "$GITHUB_PATH"
          bash "$PERFORMANCE/tools/setup-lua-ci.sh" "$RUNNER_TEMP/course-download-luals"
      - name: Установить закреплённый ShellCheck
        run: |
          tool_dir="$RUNNER_TEMP/shellcheck-0.11.0"
          mkdir -- "$tool_dir"
          curl --fail --location --silent --show-error \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$tool_dir/archive.tar.xz"
          printf '%s  %s\n' 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 "$tool_dir/archive.tar.xz" | sha256sum --check --status
          tar -xJf "$tool_dir/archive.tar.xz" --directory "$tool_dir" --strip-components=1
          "$tool_dir/shellcheck" --version
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.10.0"
          package-manager-cache: false
      - name: Подготовить стандартные инструменты качества
        run: |
          sudo apt-get update
          sudo apt-get install --yes shfmt yamllint luarocks
          npm install --global prettier@3.8.1 @taplo/cli@0.7.0
          cargo install stylua --version 2.6.0 --locked
          sudo luarocks install luacheck 1.2.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          printf '%s\n' "$HOME/.cargo/bin" "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Полный production quality и отрицательные контроли
        env:
          CORE: ${{ github.workspace }}/tests/dependencies/quarto-course
          QRC: ${{ github.workspace }}/tests/dependencies/quarto-reference-catalog
          PL: ${{ github.workspace }}/tests/dependencies/quarto-course-prairielearn
        run: |
          npm ci --ignore-scripts
          npm run check-quality
          npm run check-quality:controls
      - name: Полный контракт Download и native installed model artifacts
        env:
          CORE: ${{ github.workspace }}/tests/dependencies/quarto-course
          QRC: ${{ github.workspace }}/tests/dependencies/quarto-reference-catalog
          PL: ${{ github.workspace }}/tests/dependencies/quarto-course-prairielearn
        run: bash tools/check.sh
