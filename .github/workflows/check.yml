name: Проверка материалов Quarto
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        quarto: ["1.11.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Проверить точный commit исходников
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: ${{ matrix.quarto }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course
          ref: 6086228f7e9b466de023c51956345158c58bb5fd # Core 9.1.1: published source
          path: core-fixture
          persist-credentials: false
      - name: Проверить закреплённый Core
        run: |
          git -C core-fixture rev-parse HEAD
          test "$(git -C core-fixture rev-parse HEAD)" = "6086228f7e9b466de023c51956345158c58bb5fd"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-reference-catalog
          ref: 798f8c0d9f87fd5dcfe9ee85b79df57e647d2f3c # QRC 3.2.0: inferred TS contracts, preserving accepted history
          path: qrc-fixture
          persist-credentials: false
      - name: Проверить закреплённый QRC
        run: test "$(git -C qrc-fixture rev-parse HEAD)" = "798f8c0d9f87fd5dcfe9ee85b79df57e647d2f3c"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course-prairielearn
          ref: df8bd4aad274d618a782265b1db9c63e9b9a40f9 # C9.0.1: published ordinary owner validation
          path: pl-fixture
          persist-credentials: false
      - name: Проверить закреплённый PrairieLearn
        run: test "$(git -C pl-fixture rev-parse HEAD)" = "df8bd4aad274d618a782265b1db9c63e9b9a40f9"
      - name: Настоящая ordinary публикация и public proof
        env:
          CORE: ${{ github.workspace }}/core-fixture
          PL: ${{ github.workspace }}/pl-fixture
        run: quarto run tests/ordinary-publication.ts
      - name: Полный контракт Download и native installed model artifacts
        env:
          CORE: ${{ github.workspace }}/core-fixture
          QRC: ${{ github.workspace }}/qrc-fixture
        run: bash tools/check.sh
