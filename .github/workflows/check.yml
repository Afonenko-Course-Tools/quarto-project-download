name: Проверка материалов Quarto
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      XDG_CACHE_HOME: ${{ runner.temp }}/course-download-cache
      PERFORMANCE: ${{ github.workspace }}/.ci/performance
      COURSE_PERFORMANCE_SOURCE: ${{ github.workspace }}/.ci/performance
      LUA_LANGUAGE_SERVER: ${{ runner.temp }}/luals/bin/lua-language-server
    strategy:
      fail-fast: false
      matrix:
        quarto: ["1.11.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Подготовить доступный кеш Quarto
        run: |
          mkdir -p -- "$XDG_CACHE_HOME"
          test -w "$XDG_CACHE_HOME"
      - name: Проверить точный commit исходников
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: ${{ matrix.quarto }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course-performance
          ref: 0781f03a11f461691d7ce116f2c53bb5d8af68d7
          path: .ci/performance
          persist-credentials: false
      - name: Проверить закреплённый Performance и установить LuaLS
        run: |
          test "$(git -C "$PERFORMANCE" rev-parse HEAD)" = "0781f03a11f461691d7ce116f2c53bb5d8af68d7"
          bash "$PERFORMANCE/tools/setup-lua-ci.sh" "$RUNNER_TEMP/luals"
      - name: Установить закреплённый ShellCheck
        run: |
          tool_dir="$RUNNER_TEMP/shellcheck-0.11.0"
          mkdir -- "$tool_dir"
          curl --fail --location --silent --show-error \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$tool_dir/archive.tar.xz"
          printf '%s  %s\n' 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 "$tool_dir/archive.tar.xz" | sha256sum --check --status
          tar -xJf "$tool_dir/archive.tar.xz" --directory "$tool_dir" --strip-components=1
          "$tool_dir/shellcheck" --version
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course
          ref: d21ddfdc9e4fde58145275751dccfc1c997777df # Core: согласованный native API и функциональные файлы
          path: core-fixture
          persist-credentials: false
      - name: Проверить закреплённый Core
        run: |
          git -C core-fixture rev-parse HEAD
          test "$(git -C core-fixture rev-parse HEAD)" = "d21ddfdc9e4fde58145275751dccfc1c997777df"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-reference-catalog
          ref: 541a44836cf5ec934a101059cbee77c9ff47d134 # QRC: согласованный native API ссылок
          path: qrc-fixture
          persist-credentials: false
      - name: Проверить закреплённый QRC
        run: test "$(git -C qrc-fixture rev-parse HEAD)" = "541a44836cf5ec934a101059cbee77c9ff47d134"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afonenko-Course-Tools/quarto-course-prairielearn
          ref: fcd3320eb6dcbe0fde897ecafafcb9c0b31fb9fc # PL: согласованный public API; полный CI проверяется отдельно
          path: pl-fixture
          persist-credentials: false
      - name: Проверить закреплённый PrairieLearn
        run: test "$(git -C pl-fixture rev-parse HEAD)" = "fcd3320eb6dcbe0fde897ecafafcb9c0b31fb9fc"
      - name: Строгая проверка собственного Lua
        run: quarto run tools/check-types.ts --lua
      - name: ShellCheck и синтаксис каждого собственного shell-файла
        run: |
          shellcheck --severity=style \
            _extensions/project-download/native-ts/late-filter.sh \
            tests/fixtures/foreign-tool-failure.sh \
            tests/fixtures/git-early-failure.sh \
            tests/fixtures/git-env.sh \
            tests/fixtures/git-failure.sh \
            tests/fixtures/git-warning.sh \
            tests/fixtures/quarto-observer.sh \
            tools/check.sh
          for script in \
            _extensions/project-download/native-ts/late-filter.sh \
            tests/fixtures/foreign-tool-failure.sh \
            tests/fixtures/git-early-failure.sh \
            tests/fixtures/git-env.sh \
            tests/fixtures/git-failure.sh \
            tests/fixtures/git-warning.sh \
            tests/fixtures/quarto-observer.sh \
            tools/check.sh; do
            bash -n "$script"
          done
      - name: Полный контракт Download и native installed model artifacts
        env:
          CORE: ${{ github.workspace }}/core-fixture
          QRC: ${{ github.workspace }}/qrc-fixture
          PL: ${{ github.workspace }}/pl-fixture
        run: bash tools/check.sh
