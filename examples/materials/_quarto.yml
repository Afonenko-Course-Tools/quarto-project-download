fail-if-warnings: true
project:
  type: website
  output-dir: _site
  render: [index.qmd]
  resources: ["!data/**"]
  pre-render: _extensions/project-download/entrypoints/pre.ts
  post-render: _extensions/project-download/entrypoints/post.ts
website:
  repo-url: https://github.com/Afonenko-Course-Tools/quarto-project-download
  repo-branch: v2.0.0
  repo-subdir: examples/materials
  repo-actions: [source]
format: html
lang: ru
filters: [project-download]
project-download:
  resources:
    seminar-data:
      path: /data
      include: ["**/*.csv", "**/*.md"]
